name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Katkıları derle
        run: node scripts/build.mjs

      - name: Dosyalara sürüm damgası ekle
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(assets/[a-z0-9-]+\.(css|js))\"#\1?v=$V\"#g" site/*.html
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$V'#g" site/assets/*.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
