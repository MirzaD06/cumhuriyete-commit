name: "Cumhuriyet'e commit'imi at"
description: Geleceğe bırakacağın katkıyı yaz, bayraktaki pikselini yak.
title: "commit: "
labels: ["commit"]
body:
  - type: markdown
    attributes:
      value: |
        Katkın bir git commit mesajı gibi kısa olsun (en fazla 72 karakter).
        Örnekler: `feat: köyümdeki okula kodlama kulübü kuracağım` · `fix: öğrendiğimi kardeşime de öğreteceğim`
  - type: markdown
    attributes:
      value: |
        **Gizlilik:** Bu issue herkese açıktır; GitHub kullanıcı adın görünür. Mozaikte yalnızca rumuz, il ve mesaj gösterilir.
        Gerçek adını, e-postanı, telefonunu veya başkasına ait kişisel bilgiyi yazma. Katkını istediğin zaman kaldırtabilirsin.
  - type: input
    id: rumuz
    attributes:
      label: Rumuz
      description: Mozaikte görünecek ad (2–30 karakter). Gerçek adın olmak zorunda değil.
      placeholder: ör. genc_gelistirici
    validations:
      required: true
  - type: dropdown
    id: il
    attributes:
      label: İl
      description: Şu an yaşadığın il. Mozaikte rumuzunla birlikte görünür.
      options:
        - Adana
        - Adıyaman
        - Afyonkarahisar
        - Ağrı
        - Aksaray
        - Amasya
        - Ankara
        - Antalya
        - Ardahan
        - Artvin
        - Aydın
        - Balıkesir
        - Bartın
        - Batman
        - Bayburt
        - Bilecik
        - Bingöl
        - Bitlis
        - Bolu
        - Burdur
        - Bursa
        - Çanakkale
        - Çankırı
        - Çorum
        - Denizli
        - Diyarbakır
        - Düzce
        - Edirne
        - Elazığ
        - Erzincan
        - Erzurum
        - Eskişehir
        - Gaziantep
        - Giresun
        - Gümüşhane
        - Hakkari
        - Hatay
        - Iğdır
        - Isparta
        - İstanbul
        - İzmir
        - Kahramanmaraş
        - Karabük
        - Karaman
        - Kars
        - Kastamonu
        - Kayseri
        - Kırıkkale
        - Kırklareli
        - Kırşehir
        - Kilis
        - Kocaeli
        - Konya
        - Kütahya
        - Malatya
        - Manisa
        - Mardin
        - Mersin
        - Muğla
        - Muş
        - Nevşehir
        - Niğde
        - Ordu
        - Osmaniye
        - Rize
        - Sakarya
        - Samsun
        - Siirt
        - Sinop
        - Sivas
        - Şanlıurfa
        - Şırnak
        - Tekirdağ
        - Tokat
        - Trabzon
        - Tunceli
        - Uşak
        - Van
        - Yalova
        - Yozgat
        - Zonguldak
        - Yurt dışı
    validations:
      required: true
  - type: input
    id: mesaj
    attributes:
      label: Commit mesajı
      description: Tek satır, en fazla 72 karakter. Bağlantı, @etiket ve kişisel bilgi içeremez.
      placeholder: "feat: ..."
    validations:
      required: true
  - type: checkboxes
    id: onay
    attributes:
      label: Onay
      options:
        - label: Rumuzum, ilim ve mesajımın kampanya sitesinde herkese açık gösterilmesini kabul ediyorum.
          required: true
        - label: Mesajım siyasi parti/kişi çağrısı, nefret söylemi veya kişisel veri içermiyor.
          required: true
