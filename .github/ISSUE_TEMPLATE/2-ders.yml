        - Yozgat
        - Zonguldak
        - Yurt dışı
    validations:
      required: true
  - type: dropdown
    id: grup
    attributes:
      label: Öğrenci grubu
      options:
        - Çocuk (veli izni ve öğretmen gözetiminde)
        - Yetişkin
        - 65 yaş ve üzeri
    validations:
      required: true
  - type: input
    id: mesaj
    attributes:
      label: Öğrencinin ilk kod satırı
      description: En fazla 72 karakter.
      placeholder: "print('Yaşasın Cumhuriyet')"
    validations:
      required: true
  - type: checkboxes
    id: onay
    attributes:
      label: Onay
      options:
        - label: Dersi gerçekten verdim; öğrenci (çocuksa velisi) bu satırın rumuzsuz paylaşılmasına izin verdi.
          required: true
        - label: Rumuzum, ilim ve bu satırın kampanya sitesinde herkese açık gösterilmesini kabul ediyorum.
          required: true
